 rank:["菜鳥理賠員","理賠專員","查詐組","特偵組","鐵血獵犬"],
 streak:n=>`🔥 連續 ${n} 天・台灣時間午夜換新`,
 endlessRes:(c,b)=>`${c} 案・最佳 ${b} 分`,newBest:"🏆 新紀錄！",
 sh:(n,p,m)=>`保單疑雲 🧾 #${n}・${p}/${m}`,shE:(p,c)=>`保單疑雲 🧾 無盡模式・${c} 案 ${p} 分`,shStreak:n=>`🔥 連續 ${n} 天`,
 strikes:"",pts:"分"
}};
const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const QS=new URLSearchParams(location.search);
let L=(()=>{const q=QS.get('lang');if(q)return /^zh/i.test(q)?'zh':'en';const s=LS.get('pt_lang');if(s==='zh'||s==='en')return s;
 for(const l of (navigator.languages||[navigator.language||'en'])){if(/^zh[-_](tw|hk|mo|hant)/i.test(l)||/hant/i.test(l))return 'zh';if(/^zh/i.test(l))return 'zh';if(/^en/i.test(l))return 'en'}return 'en'})();
const T=k=>S[L][k];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function h32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=h32(String(seed));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
// Day boundaries are Asia/Taipei (UTC+8, no DST) for every player.
function dayStr(ms){return new Date(ms+8*36e5).toISOString().slice(0,10)}
function today(){return dayStr(Date.now())}
function dayNo(day){const [y,m,d]=day.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1}
function prevDay(day){const [y,m,d]=day.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)-864e5).toISOString().slice(0,10)}
let SLOTS=5,CASES=[],BYID={},run=null,lastEnd=null,loadP=null;
async function getJSON(u,tries){for(let k=0;k<tries;k++){try{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw 0;return await r.json()}catch(e){if(k<tries-1)await new Promise(r=>setTimeout(r,600*(k+1)))}}throw new Error('load')}
function valid(c){return c&&c.id&&VS.includes(c.verdict)&&Array.isArray(c.trail_en)&&Array.isArray(c.trail_zh)&&c.trail_en.length&&Array.isArray(c.cracks_en)&&c.cracks_en.length===4&&Array.isArray(c.cracks_zh)&&c.cracks_zh.length===4&&c.crack_answer>=0&&c.crack_answer<4}
function boot(){if(loadP)return loadP;loadP=getJSON('cases.json',3).then(d=>{const a=(Array.isArray(d)?d:d.cases||[]).filter(valid);if(!a.length)throw new Error('empty');
 CASES=a;SLOTS=Math.min(6,Math.max(...a.map(c=>Math.max(c.trail_en.length,c.trail_zh.length))));BYID={};for(const c of a)BYID[c.id]=c;renderStart();return a}).catch(e=>{loadP=null;throw e});return loadP}
// ---- runs ----
// Daily: a fixed shuffled order of all cases; day N takes the next 5, so every case shows before any repeats.
function docketIds(day){const ids=CASES.map(c=>c.id).sort();shuf(ids,rng('order|'+ids.length));const n=dayNo(day),o=[];
 const k=Math.min(DOCKET,ids.length);let s=((n-1)*k)%ids.length;if(s<0)s+=ids.length;for(let i=0;i<k;i++)o.push(ids[(s+i)%ids.length]);return o}
function crackOrder(seed){return shuf([0,1,2,3],rng('crack|'+seed))}
function newDaily(){const day=today(),ids=docketIds(day);run={mode:'d',day,ids,co:ids.map(id=>crackOrder(day+id)),i:0,st:'v',res:[]};save()}
function newEndless(){run={mode:'e',ids:[],co:[],i:0,st:'v',res:[],lives:LIVES};addEndless();save()}
function addEndless(){const seen=new Set(LS.get('pt_seen')||[]),used=new Set(run.ids);let p=CASES.filter(c=>!used.has(c.id)&&!seen.has(c.id));
 if(!p.length)p=CASES.filter(c=>!used.has(c.id));if(!p.length)return false;const c=p[Math.random()*p.length|0];run.ids.push(c.id);run.co.push(crackOrder(Math.random()));return true}
function save(){if(run)LS.set(run.mode==='d'?'pt_daily':'pt_endless',run)}
function cur(){return BYID[run.ids[run.i]]}
function score(r=run){return r.res.reduce((s,x)=>s+(x.vok?VP:0)+(x.cok?CP:0),0)}
function show(id){for(const s of ['start','game','end'])$(s).classList.toggle('on',s===id);document.body.classList.toggle('ingame',id==='game');document.body.classList.toggle('atend',id==='end');if(id==='start'){$('hud').textContent='';$('prog').style.width='0'}}
function bump(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function hud(){if(!run)return;const sc=score();
 if(run.mode==='d'){$('hud').textContent=`${Math.min(run.i+1,run.ids.length)}/${run.ids.length} · ${sc} ${T('pts')}`;$('prog').style.width=(run.res.filter(x=>x.c!=null).length/run.ids.length*100)+'%'}
 else{$('hud').textContent=`${'❤️'.repeat(Math.max(0,run.lives))}${'🖤'.repeat(LIVES-Math.max(0,run.lives))} · ${sc}`;$('prog').style.width=((LIVES-run.lives)/LIVES*100)+'%'}}
function tx(c,k){return c[k+'_'+L]}
function fit(el){let k=1.3;el.style.setProperty('--k',k);while(el.scrollHeight>el.clientHeight+1&&k>.4){k-=.05;el.style.setProperty('--k',k.toFixed(2))}return k}
function fitAll(){const g=$('game');if(!g.classList.contains('on'))return;g.classList.remove('nodocs');const o=$('opts');o.style.removeProperty('--ko');if(run&&run.st==='r'){fit($('rv'));return}
 if(run&&run.st==='c'){g.classList.add('nodocs');let ko=1;const over=()=>g.scrollHeight>g.clientHeight+1||[...o.children].some(b=>b.scrollHeight>b.clientHeight+1);
  while(over()&&ko>.6){ko-=.05;o.style.setProperty('--ko',ko.toFixed(2))}g.classList.remove('nodocs')}
 const k=fit($('docs'));if(run&&run.st==='c'&&k<.7)g.classList.add('nodocs')}
function renderRound(anim){const c=cur(),x=run.res[run.i]||null,st=run.st,g=$('game');
 g.className='on s-'+st+(anim?' anim':'');
 $('caseNo').textContent=run.mode==='d'?T('caseD')(run.i+1,run.ids.length):T('caseE')(run.i+1);
 $('steps').querySelectorAll('i').forEach((e,j)=>e.classList.toggle('on',j<=['v','c','r'].indexOf(st)));
 const pts=x?(x.vok?VP:0)+(x.cok?CP:0):0;$('worth').textContent=st==='v'?`+${VP}`:st==='c'?`+${CP}`:`+${pts}`;
 $('meta').textContent=`${c.year} · ${tx(c,'place')}`;
 // Every file shows the same number of exhibits; short trails are padded with redacted slips so card count never hints at the verdict.
 const tr=tx(c,'trail'),r0=rng('pad|'+c.id),sty=j=>anim&&st==='v'?` style="animation-delay:${j*70}ms"`:' style="animation:none"';
 $('docs').innerHTML=tr.map((t,j)=>`<li class="doc"${sty(j)}><b>${esc(T('ex')(j))}</b><span>${esc(t)}</span></li>`).join('')+
  Array.from({length:Math.max(0,SLOTS-tr.length)},(_,q)=>{const j=tr.length+q;return `<li class="doc red" aria-hidden="true"${sty(j)}><b>${esc(T('ex')(j))}</b><span><i style="width:${45+(r0()*50|0)}%"></i></span></li>`}).join('');
 const sp=$('stamp');if(x){sp.textContent=(x.vok?'✓ ':'✗ ')+T('st')[c.verdict];sp.className='stamp '+(x.vok?'ok':'no')}
 const o=$('opts');
 if(st==='v'){$('qText').textContent=T('qV');o.className='opts';
  o.innerHTML=VS.map((v,j)=>`<button type="button" id="b${j}" data-v="${v}">${esc(T('v')[v][0])}<small>${esc(T('v')[v][1])}</small></button>`).join('');
  o.querySelectorAll('button').forEach(b=>b.onclick=()=>pickV(b.dataset.v))}
 else if(st==='c'){$('qText').textContent=T('qC');o.className='opts c4';const co=run.co[run.i];
  o.innerHTML=co.map((ci,j)=>`<button type="button" id="b${j}" data-c="${ci}"><i aria-hidden="true">${j+1}</i><span>${esc(tx(c,'cracks')[ci])}</span></button>`).join('');
  o.querySelectorAll('button').forEach(b=>b.onclick=()=>pickC(+b.dataset.c))}
 else{o.innerHTML='';renderReveal()}
 hud();requestAnimationFrame(fitAll)}
function renderReveal(){const c=cur(),x=run.res[run.i];const v=T('st')[c.verdict];
 $('rline').textContent=T('line')(x.vok,v,VP);$('rline').style.color=x.vok?'var(--grn)':'var(--red)';
 const ans=tx(c,'cracks')[c.crack_answer];
 $('rcrack').innerHTML=`<b>${esc(T('crack'))} · ${x.cok?esc(T('rcOk'))+' +'+CP:esc(T('rcNo'))+(L==='zh'?'：':': ')+esc(tx(c,'cracks')[x.c])}</b>${esc(ans)}`;
 $('rtext').textContent=tx(c,'reveal');
 const s=c.source||{};const a=$('srcLink');a.textContent=T('src')(s.id||'');a.href=s.url||'#';a.hidden=!s.url;
 const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;$('next').textContent=over?T('finish'):T('next')}
function vib(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function pickV(v){if(run.st!=='v')return;const c=cur(),ok=v===c.verdict;run.res[run.i]={v,vok:ok,c:null,cok:false};if(run.mode==='e'&&!ok)run.lives--;
 run.st='c';save();renderRound(true);bump($('hud'));vib(ok?[15,30,15]:[40]);$('live').textContent=(ok?'✓ ':'✗ ')+T('st')[c.verdict];setTimeout(()=>$('b0')&&$('b0').focus({preventScroll:true}),60)}
function pickC(ci){if(run.st!=='c')return;const c=cur(),x=run.res[run.i];x.c=ci;x.cok=ci===c.crack_answer;run.st='r';save();
 if(run.mode==='e')addSeen([c.id]);renderRound(true);bump($('hud'));vib(x.cok?[15]:[30]);$('live').textContent=$('rline').textContent;
 setTimeout(()=>$('next').focus({preventScroll:true}),60)}
$('next').onclick=()=>{const over=run.mode==='d'?run.i+1>=run.ids.length:run.lives<=0;if(over){finish();return}
 if(run.mode==='e'&&run.i+1>=run.ids.length&&!addEndless()){finish();return}
 run.i++;run.st='v';save();renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})};
function addSeen(ids){const s=new Set(LS.get('pt_seen')||[]);ids.forEach(i=>s.add(i));LS.set('pt_seen',[...s].slice(-800))}
function finish(){addSeen(run.ids);
 if(run.mode==='d'){const days=new Set(LS.get('pt_days')||[]);days.add(run.day);LS.set('pt_days',[...days].sort().slice(-400));run.fin=1;save()}
 else{const b=LS.get('pt_best')||0;run.best=b;if(score()>b)LS.set('pt_best',score());LS.del('pt_endless')}
 lastEnd=run;show('end');renderEnd()}
function streak(){const days=new Set(LS.get('pt_days')||[]);let d=today(),n=0;if(!days.has(d))d=prevDay(d);while(days.has(d)){n++;d=prevDay(d)}return n}
function rows(r){return r.res.map(x=>(x.vok?'🟩':'🟥')+(x.cok?'🔍':'⬛'))}
function renderEnd(){const r=lastEnd;if(!r)return;run=r;const sc=score();
 if(r.mode==='d'){const mx=r.ids.length*(VP+CP);$('score').innerHTML=`${sc}<small>/${mx}</small>`;const q=sc/mx;$('rank').textContent=T('rank')[q>=.9?4:q>=.65?3:q>=.4?2:q>=.2?1:0];
  $('streak').textContent=T('streak')(streak());$('againBtn').textContent=T('endless2');$('hud').textContent=`#${dayNo(r.day)} · ${sc} ${T('pts')}`}
 else{$('score').textContent=sc;const best=Math.max(r.best||0,sc);$('rank').textContent=sc>(r.best||0)&&sc>0?T('newBest'):T('rank')[Math.min(4,Math.floor(r.res.length/3))];
  $('streak').textContent=T('endlessRes')(r.res.length,best);$('againBtn').textContent=T('again');$('hud').textContent=`${sc} ${T('pts')}`}
 $('grid').innerHTML=rows(r).map(x=>`<span>${x}</span>`).join('');$('prog').style.width='100%';$('toast').textContent=''}
$('shareBtn').onclick=async()=>{const r=lastEnd,sc=score(r);let txt;
 if(r.mode==='d'){txt=T('sh')(dayNo(r.day),sc,r.ids.length*(VP+CP))+'\n'+rows(r).join(' ');const s=streak();if(s>1)txt+='\n'+T('shStreak')(s)}
 else txt=T('shE')(sc,r.res.length)+'\n'+rows(r).join(' ');
 const url=URL0+(r.mode==='d'?'?daily':'');
 try{if(navigator.share){await navigator.share({text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt+'\n'+url);$('toast').textContent=T('copied')}catch(e){$('toast').textContent=txt+'\n'+url}};
$('againBtn').onclick=()=>startEndless();
// ---- start ----
function dailyState(){const d=LS.get('pt_daily');return d&&d.day===today()&&d.ids&&d.ids.every(id=>BYID[id])?d:null}
function renderStart(){const day=today(),n=dayNo(day);if(!CASES.length){$('dailyBtn').innerHTML=T('daily')(n);$('endlessBtn').innerHTML=T('endless')(LS.get('pt_best')||0);return}const d=dailyState();
 $('dailyBtn').innerHTML=d&&d.fin?T('dailyDone')(n,score(d),d.ids.length*(VP+CP)):d?T('dailyRes')(n,d.i):T('daily')(n);
 $('endlessBtn').innerHTML=T('endless')(LS.get('pt_best')||0);$('upd').textContent=T('updated')(CASES.length)}
let retryF=null;
async function withData(f,again){retryF=again;show('game');$('loading').hidden=false;$('retryBtn').hidden=true;$('game').className='on s-load';
 try{await boot();$('loading').hidden=true;f()}catch(e){$('loading').querySelector('span').textContent=T('loadFail');$('retryBtn').hidden=false}}
$('retryBtn').onclick=()=>{$('loading').querySelector('span').textContent=T('loading');retryF&&retryF()};
function startDaily(){withData(()=>{const d=dailyState();if(d&&d.fin){run=d;lastEnd=d;show('end');renderEnd();return}
 if(d)run=d;else newDaily();show('game');renderRound(true);$('b0')&&$('b0').focus({preventScroll:true})},startDaily)}
function startEndless(){withData(()=>{const e=LS.get('pt_endless');if(e&&e.ids&&e.ids.every(id=>BYID[id])&&e.lives>0)run=e;else newEndless();show('game');renderRound(true)},startEndless)}
$('dailyBtn').onclick=startDaily;$('endlessBtn').onclick=startEndless;
$('logo').onclick=()=>{show('start');renderStart();history.replaceState(null,'',location.pathname+(QS.get('lang')?'?lang='+QS.get('lang'):''))};
function applyLang(){document.documentElement.lang=L==='zh'?'zh-Hant':'en';document.title=L==='zh'?'保單疑雲 🧾 Paper Trail':'Paper Trail 🧾 保單疑雲';
 $('lEn').classList.toggle('on',L==='en');$('lZh').classList.toggle('on',L==='zh');$('logo').title=L==='zh'?'回首頁':'Home';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=T(e.dataset.t);if(typeof v==='string')e.textContent=v});
 renderStart();if($('game').classList.contains('on')&&run&&CASES.length)renderRound(false);if($('end').classList.contains('on'))renderEnd()}
$('langBtn').onclick=()=>{L=L==='zh'?'en':'zh';LS.set('pt_lang',L);applyLang()};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(!$('game').classList.contains('on')||!run)return;
 const n=+e.key;if(n>=1&&n<=4){const b=$('b'+(n-1));if(b){b.click();e.preventDefault()}}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fitAll,80)});
applyLang();
boot().then(()=>{if(QS.has('daily'))startDaily()}).catch(()=>{if(QS.has('daily'))startDaily()});
</script>
